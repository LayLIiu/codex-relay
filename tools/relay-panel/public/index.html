<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Relay 控制面板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0e1014;
      color: #e8ecf1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 16px 60px;
    }
    .panel { width: 100%; max-width: 460px; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header .sub { font-size: 12px; color: #8b93a1; margin-top: 3px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #1b2029;
      border: 1px solid #2a313d;
      color: #9aa3b2;
    }
    .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #5c6574; }
    .badge.on { color: #7fe0a0; border-color: #2e5b44; background: #16241c; }
    .badge.on .dot { background: #37d67a; box-shadow: 0 0 8px #37d67a; }
    .badge.off { color: #ff9f9f; border-color: #5b2e2e; background: #241616; }
    .badge.off .dot { background: #ff6b6b; }

    .card {
      background: #151a22;
      border: 1px solid #242c38;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: #cfd6e0; }

    .actions { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      height: 46px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.05s;
      color: #fff;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.start { background: #1f9d5a; }
    .btn.stop { background: #c04a4a; }

    .qr-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .qr-box {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      width: 100%;
    }
    .qr-box img { width: 220px; height: 220px; image-rendering: pixelated; }
    .qr-placeholder { color: #6d7686; font-size: 13px; text-align: center; line-height: 1.6; }

    .pair-payload {
      width: 100%;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #9fb0c3;
      background: #0d1117;
      border: 1px solid #242c38;
      border-radius: 8px;
      padding: 10px;
      word-break: break-all;
      max-height: 84px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .row { display: flex; gap: 10px; }
    .row input {
      flex: 1;
      height: 46px;
      background: #0d1117;
      border: 1px solid #2a313d;
      border-radius: 10px;
      color: #e8ecf1;
      font-size: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 1px;
      text-align: center;
      outline: none;
      text-transform: uppercase;
    }
    .row input:focus { border-color: #4d7dff; }
    .row .btn.approve { flex: 0 0 96px; background: #3a6ef0; }

    .message {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
      min-height: 20px;
      color: #9aa3b2;
    }
    .message.ok { color: #7fe0a0; }
    .message.err { color: #ff9f9f; }

    .log-box {
      background: #0a0d11;
      border: 1px solid #1f2631;
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #8b96a6;
      height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
    }
    .hint { font-size: 12px; color: #7a8394; margin-top: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div>
        <h1>Codex Relay 控制面板</h1>
        <div class="sub">一键启动 / 扫码配对 / 批准设备</div>
      </div>
      <div class="badge off" id="statusBadge"><span class="dot"></span><span id="statusText">未启动</span></div>
    </div>

    <div class="card">
      <h2>服务控制</h2>
      <div class="actions">
        <button class="btn start" id="btnStart">🚀 启动服务</button>
        <button class="btn stop" id="btnStop">⏹ 停止服务</button>
      </div>
      <div class="message" id="startMsg"></div>
    </div>

    <div class="card">
      <h2>配对二维码</h2>
      <div class="qr-wrap">
        <div class="qr-box" id="qrBox">
          <div class="qr-placeholder">先点击上方「启动服务」<br />二维码会在这里显示</div>
        </div>
        <div class="pair-payload" id="pairPayload">—</div>
      </div>
    </div>

    <div class="card">
      <h2>批准设备配对</h2>
      <div class="row">
        <input id="approveCode" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" />
        <button class="btn approve" id="btnApprove">批准</button>
      </div>
      <div class="message" id="approveMsg"></div>
      <div class="hint">
        鸿蒙端扫码后，服务端会给出一个配对码（XXXX-XXXX）。把它填到上面点「批准」，
        相当于执行 <code>npx codex-relay@latest approve XXXX-XXXX</code>。
      </div>
    </div>

    <div class="card">
      <h2>服务日志</h2>
      <div class="log-box" id="logBox">（暂无日志）</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const badge = $("statusBadge");
    const statusText = $("statusText");
    let lastLogLength = 0;

    function setStatus(running) {
      badge.className = running ? "badge on" : "badge off";
      statusText.textContent = running ? "运行中" : "未启动";
    }

    function showMessage(id, text, isError) {
      const el = $(id);
      el.textContent = text;
      el.className = "message" + (isError ? " err" : text ? " ok" : "");
    }

    function renderQr(payload) {
      const box = $("qrBox");
      $("pairPayload").textContent = payload || "—";
      if (!payload) {
        box.innerHTML = '<div class="qr-placeholder">先启动服务<br />配对码会在这里显示</div>';
        return;
      }
      if (window.QRCode) {
        QRCode.toDataURL(payload, { width: 220, margin: 1 }, (err, url) => {
          if (err) {
            box.innerHTML = '<div class="qr-placeholder">二维码生成失败，请复制下方链接</div>';
            return;
          }
          box.innerHTML = '<img src="' + url + '" alt="配对二维码" />';
        });
      } else {
        box.innerHTML = '<div class="qr-placeholder">二维码库未加载（可能离线），请直接复制下方链接粘贴到 App</div>';
      }
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        setStatus(data.relayRunning);
        if (data.pairingPayload) {
          renderQr(data.pairingPayload);
        }
        if (data.log && data.log.length !== lastLogLength) {
          const box = $("logBox");
          box.textContent = data.log;
          box.scrollTop = box.scrollHeight;
          lastLogLength = data.log.length;
        }
      } catch (_) {
        setStatus(false);
      }
    }

    $("btnStart").addEventListener("click", async () => {
      showMessage("startMsg", "正在启动服务...");
      $("btnStart").disabled = true;
      try {
        const res = await fetch("/api/start", { method: "POST" });
        const data = await res.json();
        showMessage("startMsg", data.message || (data.ok ? "已启动" : "失败"), !data.ok);
        setStatus(data.relayRunning);
        if (data.pairingPayload) renderQr(data.pairingPayload);
      } catch (error) {
        showMessage("startMsg", "启动失败：" + error.message, true);
      } finally {
        $("btnStart").disabled = false;
        refreshStatus();
      }
    });

    $("btnStop").addEventListener("click", async () => {
      showMessage("startMsg", "正在停止服务...");
      try {
        const res = await fetch("/api/stop", { method: "POST" });
        const data = await res.json();
        showMessage("startMsg", data.message, false);
        setStatus(data.relayRunning);
      } catch (error) {
        showMessage("startMsg", "停止失败：" + error.message, true);
      }
      refreshStatus();
    });

    $("btnApprove").addEventListener("click", async () => {
      const code = $("approveCode").value.trim();
      if (!code) {
        showMessage("approveMsg", "请先输入配对码", true);
        return;
      }
      showMessage("approveMsg", "正在批准...");
      $("btnApprove").disabled = true;
      try {
        const res = await fetch("/api/approve", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        showMessage("approveMsg", data.message || (data.ok ? "配对已批准" : "批准失败"), !data.ok);
        if (data.ok) $("approveCode").value = "";
      } catch (error) {
        showMessage("approveMsg", "批准失败：" + error.message, true);
      } finally {
        $("btnApprove").disabled = false;
      }
    });

    $("approveCode").addEventListener("input", (e) => {
      const upper = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      e.target.value = upper.length > 4 ? upper.slice(0, 4) + "-" + upper.slice(4, 8) : upper;
    });

    refreshStatus();
    setInterval(refreshStatus, 2500);
  </script>
</body>
</html>
