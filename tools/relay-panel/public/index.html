<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Relay 控制面板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0e1014;
      color: #e8ecf1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 16px 60px;
    }
    .panel { width: 100%; max-width: 460px; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header .sub { font-size: 12px; color: #8b93a1; margin-top: 3px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #1b2029;
      border: 1px solid #2a313d;
      color: #9aa3b2;
    }
    .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #5c6574; }
    .badge.on { color: #7fe0a0; border-color: #2e5b44; background: #16241c; }
    .badge.on .dot { background: #37d67a; box-shadow: 0 0 8px #37d67a; }
    .badge.off { color: #ff9f9f; border-color: #5b2e2e; background: #241616; }
    .badge.off .dot { background: #ff6b6b; }

    .card {
      background: #151a22;
      border: 1px solid #242c38;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: #cfd6e0; }

    .actions { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      height: 46px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.05s;
      color: #fff;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.start { background: #1f9d5a; }
    .btn.stop { background: #c04a4a; }
    .btn.build { background: #3a6ef0; }
    .btn.allow {
      background: #2f6485;
      margin-top: 10px;
      width: 100%;
    }

    .qr-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .qr-box {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      width: 100%;
    }
    .qr-box img { width: 220px; height: 220px; image-rendering: pixelated; }
    .qr-placeholder { color: #6d7686; font-size: 13px; text-align: center; line-height: 1.6; }

    .pair-payload {
      width: 100%;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #9fb0c3;
      background: #0d1117;
      border: 1px solid #242c38;
      border-radius: 8px;
      padding: 10px;
      word-break: break-all;
      max-height: 84px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .lan-note {
      width: 100%;
      font-size: 11px;
      color: #7a8394;
      line-height: 1.5;
      word-break: break-all;
      text-align: center;
    }
    .copy-row {
      display: flex;
      gap: 8px;
      width: 100%;
      align-items: stretch;
    }
    .copy-row .pair-payload {
      flex: 1;
      margin: 0;
    }
    .copy-btn {
      flex: 0 0 72px;
      height: 44px;
      border: 1px solid #2a313d;
      border-radius: 8px;
      background: #1b2029;
      color: #cfd6e0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.05s;
    }
    .copy-btn:hover { background: #242c38; }
    .copy-btn:active { transform: scale(0.97); }
    .copy-btn.copied { color: #7fe0a0; border-color: #2e5b44; }
    .row { display: flex; gap: 10px; }
    .row input {
      flex: 1;
      height: 46px;
      background: #0d1117;
      border: 1px solid #2a313d;
      border-radius: 10px;
      color: #e8ecf1;
      font-size: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 1px;
      text-align: center;
      outline: none;
      text-transform: uppercase;
    }
    .row input:focus { border-color: #4d7dff; }
    .row .btn.approve { flex: 0 0 96px; background: #3a6ef0; }

    .message {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
      min-height: 20px;
      color: #9aa3b2;
    }
    .message.ok { color: #7fe0a0; }
    .message.err { color: #ff9f9f; }

    .log-box {
      background: #0a0d11;
      border: 1px solid #1f2631;
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #8b96a6;
      height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
    }
    .hint { font-size: 12px; color: #7a8394; margin-top: 12px; line-height: 1.6; }
    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 13, 17, 0.94);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .login-overlay.hidden { display: none; }
    .login-card {
      width: 100%;
      max-width: 320px;
      background: #151a22;
      border: 1px solid #242c38;
      border-radius: 14px;
      padding: 28px 22px;
      text-align: center;
    }
    .login-card h2 { font-size: 17px; margin-bottom: 6px; color: #e8ecf1; }
    .login-card p { font-size: 13px; color: #8b93a1; margin-bottom: 16px; }
    .login-card input {
      width: 100%;
      height: 44px;
      background: #0d1117;
      border: 1px solid #2a313d;
      border-radius: 10px;
      color: #e8ecf1;
      font-size: 15px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
    }
    .login-card input:focus { border-color: #4d7dff; }
    .btn.login { width: 100%; height: 44px; background: #3a6ef0; border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .login-card .message { min-height: 20px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <h2>🔐 Codex Relay 控制面板</h2>
      <p>请输入访问密码</p>
      <input id="loginToken" type="password" placeholder="访问密码" autocomplete="off" />
      <button class="btn login" id="loginBtn">进入</button>
      <div class="message" id="loginMsg"></div>
    </div>
  </div>
  <div class="panel">
    <div class="header">
      <div>
        <h1>Codex Relay 控制面板</h1>
        <div class="sub">一键启动 / 扫码配对 / 批准设备</div>
      </div>
      <div class="badge off" id="statusBadge"><span class="dot"></span><span id="statusText">未启动</span></div>
    </div>

    <div class="card">
      <h2>服务控制</h2>
      <div class="actions">
        <button class="btn start" id="btnStart">🚀 启动服务</button>
        <button class="btn stop" id="btnStop">⏹ 停止服务</button>
        <button class="btn build" id="btnBuild">🔨 构建并重启</button>
      </div>
      <button class="btn allow" id="btnFirewall">🛡 修复 Windows 防火墙</button>
      <div class="message" id="startMsg"></div>
    </div>

    <div class="card">
      <h2>配对二维码</h2>
      <div class="qr-wrap">
        <div class="qr-box" id="qrBox">
          <div class="qr-placeholder">先点击上方「启动服务」<br />二维码会在这里显示</div>
        </div>
        <div class="copy-row">
          <div class="pair-payload" id="pairPayload">—</div>
          <button class="copy-btn" id="copyBtn">复制</button>
        </div>
        <div class="lan-note" id="lanNote">局域网备选：—</div>
      </div>
    </div>

    <div class="card">
      <h2>批准设备配对</h2>
      <div class="row">
        <input id="approveCode" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" />
        <button class="btn approve" id="btnApprove">批准</button>
      </div>
      <div class="message" id="approveMsg"></div>
      <div class="hint">
        鸿蒙端扫码后，服务端会给出一个配对码（XXXX-XXXX）。把它填到上面点「批准」，
        相当于执行 <code>npx codex-relay@latest approve XXXX-XXXX</code>。
      </div>
    </div>

    <div class="card">
      <h2>服务日志</h2>
      <div class="log-box" id="logBox">（暂无日志）</div>
    </div>
  </div>

  <script src="/qrcode.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const badge = $("statusBadge");
    const statusText = $("statusText");
    let lastLogLength = 0;
    let panelToken = localStorage.getItem("panelToken") || "";
    const apiFetch = (url, options) => {
      const next = options ? { ...options } : {};
      next.headers = { ...(next.headers || {}), "x-panel-token": panelToken };
      return fetch(url, next);
    };

    function setStatus(running) {
      badge.className = running ? "badge on" : "badge off";
      statusText.textContent = running ? "运行中" : "未启动";
    }

    function showMessage(id, text, isError) {
      const el = $(id);
      el.textContent = text;
      el.className = "message" + (isError ? " err" : text ? " ok" : "");
    }

    function renderQr(payload) {
      const box = $("qrBox");
      $("pairPayload").textContent = payload || "—";
      $("lanNote").textContent = "局域网备选：—";
      if (!payload) {
        box.innerHTML = '<div class="qr-placeholder">先启动服务<br />配对码会在这里显示</div>';
        return;
      }
      box.innerHTML = "";
      if (window.QRCode) {
        try {
          new QRCode(box, {
            text: payload,
            width: 220,
            height: 220,
            colorDark: "#000000",
            colorLight: "#ffffff"
          });
        } catch (_) {
          box.innerHTML = '<div class="qr-placeholder">二维码生成失败，请复制下方链接</div>';
        }
      } else {
        box.innerHTML = '<div class="qr-placeholder">二维码库未加载，请直接复制下方链接粘贴到 App</div>';
      }
    }

    async function refreshStatus() {
      try {
        const res = await apiFetch("/api/status");
        const data = await res.json();
        setStatus(data.relayRunning);
        const qrPayload = data.publicPairingPayload || data.pairingPayload;
        if (qrPayload) {
          renderQr(qrPayload);
          if (data.connectUrl) {
            $("lanNote").textContent = "局域网备选：" + data.connectUrl;
          }
        }
        if (data.log && data.log.length !== lastLogLength) {
          const box = $("logBox");
          box.textContent = data.log;
          box.scrollTop = box.scrollHeight;
          lastLogLength = data.log.length;
        }
      } catch (_) {
        setStatus(false);
      }
    }

    $("btnStart").addEventListener("click", async () => {
      showMessage("startMsg", "正在启动服务...");
      $("btnStart").disabled = true;
      try {
        const res = await apiFetch("/api/start", { method: "POST" });
        const data = await res.json();
        showMessage("startMsg", data.message || (data.ok ? "已启动" : "失败"), !data.ok);
        setStatus(data.relayRunning);
        const qrPayload = data.publicPairingPayload || data.pairingPayload;
        if (qrPayload) renderQr(qrPayload);
      } catch (error) {
        showMessage("startMsg", "启动失败：" + error.message, true);
      } finally {
        $("btnStart").disabled = false;
        refreshStatus();
      }
    });

    $("btnStop").addEventListener("click", async () => {
      showMessage("startMsg", "正在停止服务...");
      try {
        const res = await apiFetch("/api/stop", { method: "POST" });
        const data = await res.json();
        showMessage("startMsg", data.message, false);
        setStatus(data.relayRunning);
      } catch (error) {
        showMessage("startMsg", "停止失败：" + error.message, true);
      }
      refreshStatus();
    });

    $("btnBuild").addEventListener("click", async () => {
      showMessage("startMsg", "正在构建并重启，请稍候...");
      $("btnBuild").disabled = true;
      try {
        const res = await apiFetch("/api/build-restart", { method: "POST" });
        const data = await res.json();
        showMessage("startMsg", data.message || (data.ok ? "完成" : "失败"), !data.ok);
        setStatus(data.relayRunning);
      } catch (error) {
        showMessage("startMsg", "构建重启失败：" + error.message, true);
      } finally {
        $("btnBuild").disabled = false;
        refreshStatus();
      }
    });

    $("btnFirewall").addEventListener("click", async () => {
      showMessage("startMsg", "正在添加 Windows 防火墙规则...");
      $("btnFirewall").disabled = true;
      try {
        const res = await apiFetch("/api/firewall-allow", { method: "POST" });
        const data = await res.json();
        showMessage("startMsg", data.message || (data.ok ? "已处理" : "处理失败"), !data.ok);
      } catch (error) {
        showMessage("startMsg", "添加防火墙规则失败：" + error.message, true);
      } finally {
        $("btnFirewall").disabled = false;
      }
    });

    $("btnApprove").addEventListener("click", async () => {
      const code = $("approveCode").value.trim();
      if (!code) {
        showMessage("approveMsg", "请先输入配对码", true);
        return;
      }
      showMessage("approveMsg", "正在批准...");
      $("btnApprove").disabled = true;
      try {
        const res = await apiFetch("/api/approve", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        showMessage("approveMsg", data.message || (data.ok ? "配对已批准" : "批准失败"), !data.ok);
        if (data.ok) $("approveCode").value = "";
      } catch (error) {
        showMessage("approveMsg", "批准失败：" + error.message, true);
      } finally {
        $("btnApprove").disabled = false;
      }
    });

    $("approveCode").addEventListener("input", (e) => {
      const upper = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      e.target.value = upper.length > 4 ? upper.slice(0, 4) + "-" + upper.slice(4, 8) : upper;
    });

    $("copyBtn").addEventListener("click", async () => {
      const text = $("pairPayload").textContent.trim();
      if (!text || text === "—") {
        return;
      }
      const markCopied = () => {
        const btn = $("copyBtn");
        btn.textContent = "已复制";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "复制";
          btn.classList.remove("copied");
        }, 1500);
      };
      try {
        await navigator.clipboard.writeText(text);
        markCopied();
      } catch (_) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        markCopied();
      }
    });

    async function checkAuth() {
      try {
        const res = await apiFetch("/api/status");
        if (res.status === 401) {
          $("loginOverlay").classList.remove("hidden");
          return;
        }
        $("loginOverlay").classList.add("hidden");
        refreshStatus();
        setInterval(refreshStatus, 2500);
      } catch (_) {
        $("loginOverlay").classList.remove("hidden");
      }
    }

    $("loginBtn").addEventListener("click", async () => {
      const token = $("loginToken").value.trim();
      if (!token) {
        return;
      }
      try {
        const res = await fetch("/api/auth", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ token }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          panelToken = token;
          localStorage.setItem("panelToken", token);
          $("loginOverlay").classList.add("hidden");
          $("loginMsg").textContent = "";
          refreshStatus();
          setInterval(refreshStatus, 2500);
        } else {
          $("loginMsg").textContent = "密码错误";
          $("loginMsg").className = "message err";
        }
      } catch (error) {
        $("loginMsg").textContent = "连接失败：" + error.message;
        $("loginMsg").className = "message err";
      }
    });

    checkAuth();
  </script>
</body>
</html>
